<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hilton Niseko Village</title>
  <style>html, body { margin: 0; height: 100%; background: hsl(220, 55%, 14%); }</style>
  <script>
    // /luckydraw → registration form, version WITH the lucky wheel.
    // GitHub Pages only serves files, so this page forwards to index.html?lucky
    // (index.html then shows /luckydraw again in the address bar).
    // Old links to the wheel itself (luckydraw.html?nombre=…) go to wheel.html.
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.has("nombre") || p.has("correo")) {
        location.replace("wheel.html" + location.search);
        return;
      }
      p.set("lucky", "");
      location.replace("index.html?" + p.toString().replace("lucky=", "lucky"));
    })();
  </script>
</head>
<body></body>
</html>
